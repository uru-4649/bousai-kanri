:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#26352d;background:#f6f7f2}*{box-sizing:border-box}body{margin:0;padding-bottom:95px}header{background:#e8eee7;padding:22px 17px 15px}h1{font-size:23px;margin:0 0 5px}small,.muted{color:#68736a}.subtitle{font-size:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:9px 12px;background:#e3e9e2;color:#263b30}button.primary{background:#4e715b;color:white}button.ghost{background:white;border:1px solid #d9e1d8}button.danger{color:#a33a3a;background:#fff0ee}main{padding:13px 12px;max-width:760px;margin:auto}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar button{font-size:13px}.group{background:white;border:1px solid #e2e8df;border-radius:14px;margin:0 0 12px;overflow:hidden}.grouphead{width:100%;text-align:left;display:flex;justify-content:space-between;background:#edf2ec;font-weight:700;padding:13px}.row{border-top:1px solid #eef0ed;padding:11px 12px}.rowhead{display:flex;align-items:center;gap:8px;justify-content:space-between}.rowname{font-weight:700;flex:1;min-width:0}.counts{font-size:12px;color:#657066}.short{color:#c52430;font-weight:800}.detail{margin:9px 0 0 10px;border-left:2px solid #e4eae2;padding-left:10px}.batch{display:flex;gap:6px;align-items:center;justify-content:space-between;margin:7px 0;font-size:12px;flex-wrap:wrap}.batchmeta{flex:1;min-width:145px}.stepper{display:inline-flex;align-items:center;gap:3px}.stepper button{padding:4px 10px;font-size:17px}.stepper input{width:55px;text-align:center;border:1px solid #d7dfd5;border-radius:7px;padding:5px 2px;font-size:14px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.actions button{font-size:12px;padding:6px 9px}.nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:white;border-top:1px solid #dfe5dc;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px #00000009;z-index:4}.nav button{border-radius:0;background:transparent;padding:9px 1px;font-size:10px;min-height:60px}.nav button span{display:block;font-size:21px;margin-bottom:3px}.nav .active{color:#34684a;background:#eff5ef;font-weight:800}.summary{font-size:13px;background:#fff;border:1px solid #e0e7dd;border-radius:12px;padding:12px;margin-bottom:12px}.buyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.buyrow .rowname{min-width:110px}.buyqty{display:flex;align-items:center;gap:6px;font-size:12px}.buyqty input{width:60px;padding:5px;border:1px solid #d4ded4;border-radius:7px;text-align:center}.empty{text-align:center;color:#68736a;padding:30px}.modalbg{position:fixed;inset:0;background:#0006;z-index:8;display:flex;align-items:flex-end;justify-content:center}.modal{background:white;border-radius:19px 19px 0 0;width:100%;max-width:760px;max-height:88vh;overflow:auto;padding:18px 18px calc(20px + env(safe-area-inset-bottom))}.modal h2{margin:0 0 14px;font-size:19px}.field{display:block;margin:11px 0;font-size:13px;font-weight:600}.field input,.field select{display:block;width:100%;margin-top:5px;padding:11px;border:1px solid #cfd9ce;border-radius:9px;background:white}.modalfoot{display:flex;gap:9px;justify-content:flex-end;margin-top:17px}.tip{font-size:12px;color:#657267;line-height:1.7}.check{width:20px;height:20px;accent-color:#4e715b}.hidden{display:none}.pill{font-size:11px;background:#edf1eb;padding:4px 6px;border-radius:8px}.totalbatch{font-size:12px;margin:6px 0;color:#56675a}input[type=number]{appearance:textfield} @media(min-width:800px){.nav{max-width:760px;margin:auto;border-left:1px solid #eee;border-right:1px solid #eee}}
</style></head><body><header><div class="top"><div><h1>🌿 防災管理</h1><div class="subtitle">家族4人・7日間の備えを、わかりやすく。</div></div><button class="ghost" onclick="openSettings()">⚙️ 設定</button></div></header><main id="app"></main><nav class="nav" id="nav"></nav><div id="overlay"></div><script>
const KEY='bousai-kanri-v1';const TABS=[['stock','📦','備蓄'],['rolling','🔄','ローリング'],['total','📋','全体合計'],['buy','🛒','買い足し'],['useful','✨','あると便利']];
const defaults=[
['stock','飲料水','飲料水',42,'本','2Lボトル換算。飲料・調理用に計84L'],['stock','食品','アルファ米・非常食ご飯',28,'食'],['stock','食品','レトルトご飯',14,'食'],['stock','食品','缶詰',21,'個'],['stock','食品','レトルトおかず',14,'食'],['stock','食品','保存用パン',8,'食'],['stock','食品','栄養補助食品',8,'個'],['stock','食品','保存用お菓子',8,'袋'],['stock','食品','野菜ジュース',7,'本'],['stock','食品','粉末スープ',14,'食'],['stock','トイレ・衛生','携帯トイレ',140,'回分','1人1日5回を想定'],['stock','トイレ・衛生','防臭袋',40,'枚'],['stock','トイレ・衛生','トイレットペーパー',12,'ロール'],['stock','トイレ・衛生','ティッシュ',5,'箱'],['stock','トイレ・衛生','ウェットティッシュ',4,'袋'],['stock','トイレ・衛生','生理用品',0,'袋'],['stock','トイレ・衛生','マスク',28,'枚'],['stock','トイレ・衛生','歯ブラシ',4,'本'],['stock','トイレ・衛生','歯磨き用品',1,'個'],['stock','トイレ・衛生','石けん',1,'個'],['stock','トイレ・衛生','ドライシャンプー',1,'本'],['stock','トイレ・衛生','おむつ・介護用品',0,'個'],['stock','電源・照明','懐中電灯',2,'個'],['stock','電源・照明','ランタン',2,'個'],['stock','電源・照明','乾電池',12,'本'],['stock','電源・照明','モバイルバッテリー',2,'台'],['stock','電源・照明','充電ケーブル',2,'本'],['stock','電源・照明','携帯ラジオ',1,'台'],['stock','調理・生活','カセットコンロ',1,'台'],['stock','調理・生活','ガスボンベ',12,'本'],['stock','調理・生活','給水タンク',2,'個'],['stock','調理・生活','非常用持ち出し袋',4,'個'],['stock','調理・生活','アルミブランケット',4,'枚'],['stock','調理・生活','毛布・寝袋',4,'枚'],['stock','調理・生活','ヘルメット・防災ずきん',4,'個'],['stock','調理・生活','軍手',4,'組'],['stock','調理・生活','ホイッスル',4,'個'],['stock','調理・生活','救急セット',1,'組'],['stock','調理・生活','常備薬',0,'日分'],['stock','調理・生活','消火器',1,'本'],['stock','調理・生活','簡易スリッパ',4,'足'],['stock','季節・家族','暑さ対策用品',0,'個'],['stock','季節・家族','防寒用品',0,'個'],['stock','季節・家族','ペット用品',0,'個'],
['rolling','飲料','飲料水',0,'本'],['rolling','飲料','お茶・飲料',0,'本'],['rolling','食品','パックご飯',24,'食'],['rolling','食品','インスタントラーメン',12,'袋'],['rolling','食品','乾麺',6,'袋'],['rolling','食品','缶詰',12,'個'],['rolling','食品','レトルトカレー',8,'食'],['rolling','食品','レトルトおかず',8,'食'],['rolling','食品','お菓子',8,'袋'],['rolling','食品','シリアル',2,'袋'],['rolling','食品','乾物',4,'袋'],['rolling','食品','調味料',0,'個'],['rolling','日用品','トイレットペーパー',12,'ロール'],['rolling','日用品','ティッシュ',5,'箱'],['rolling','日用品','ウェットティッシュ',3,'袋'],['rolling','日用品','ごみ袋',2,'袋'],['rolling','日用品','洗剤',2,'本'],
['useful','食事に便利','割り箸',30,'膳'],['useful','食事に便利','紙皿',30,'枚'],['useful','食事に便利','紙コップ',30,'個'],['useful','食事に便利','使い捨てスプーン',20,'本'],['useful','食事に便利','食品用ラップ',3,'本'],['useful','食事に便利','アルミホイル',1,'本'],['useful','食事に便利','キッチンペーパー',3,'ロール'],['useful','食事に便利','ジッパー付き保存袋',30,'枚'],['useful','片付け・衛生','ビニール袋',50,'枚'],['useful','片付け・衛生','大きいごみ袋',30,'枚'],['useful','片付け・衛生','使い捨て手袋',30,'枚'],['useful','片付け・衛生','除菌シート',3,'袋'],['useful','片付け・衛生','タオル',8,'枚'],['useful','片付け・衛生','洗濯ロープ',1,'本'],['useful','片付け・衛生','洗濯ばさみ',10,'個'],['useful','片付け・衛生','簡易洗濯袋',1,'個'],['useful','補修・情報','ガムテープ',2,'巻'],['useful','補修・情報','養生テープ',2,'巻'],['useful','補修・情報','油性ペン',2,'本'],['useful','補修・情報','メモ帳',2,'冊'],['useful','補修・情報','現金（小銭）',0,'円'],['useful','補修・情報','乾電池式充電器',1,'個'],['useful','季節・屋外','レインコート',4,'着'],['useful','季節・屋外','うちわ・扇子',4,'個'],['useful','季節・屋外','冷却用品',4,'個'],['useful','季節・屋外','使い捨てカイロ',20,'個'],['useful','季節・屋外','虫よけ',1,'個'],['useful','季節・屋外','ブルーシート',1,'枚']
];
let seq=0;function uid(){return 'i'+Date.now().toString(36)+(++seq).toString(36)}function seed(){return defaults.map((d,i)=>({id:'d'+i,defaultId:'d'+i,page:d[0],cat:d[1],name:d[2],target:d[3],unit:d[4],note:d[5]||'',batches:[]}))}function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.items))return x}catch(e){}return {items:seed(),tab:'stock',closed:{},totalOpen:{},selected:{},buyQty:{},family:4,days:7}}let state=load();function save(){localStorage.setItem(KEY,JSON.stringify(state))}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const total=i=>i.batches.reduce((s,b)=>s+(Number(b.qty)||0),0);const shortage=i=>Math.max(0,(Number(i.target)||0)-total(i));const get=id=>state.items.find(i=>i.id===id);function fmtDate(d){return d?esc(d.replaceAll('-','/')):'期限なし'}function group(items){return Object.groupBy?Object.groupBy(items,i=>i.cat):items.reduce((a,i)=>{(a[i.cat]??=[]).push(i);return a}, {})}function render(){document.getElementById('nav').innerHTML=TABS.map(([id,icon,label])=>`<button class="${state.tab===id?'active':''}" onclick="setTab('${id}')"><span>${icon}</span>${label}</button>`).join('');let a=document.getElementById('app');if(state.tab==='buy')a.innerHTML=renderBuy();else if(state.tab==='total')a.innerHTML=renderTotal();else a.innerHTML=renderItems(state.tab);}
function setTab(t){state.tab=t;save();render();window.scrollTo(0,0)}function renderItems(page){let items=state.items.filter(i=>i.page===page),out=`<div class="toolbar"><button class="primary" onclick="openItem(null,'${page}')">＋ 商品を追加</button><span class="muted" style="font-size:12px">数量は＋－・直接入力で変更</span></div>`;for(let [cat,arr] of Object.entries(group(items))){let closed=!!state.closed[page+cat];out+=`<section class="group"><button class="grouphead" onclick="toggleCat('${esc(page+cat)}')"><span>${esc(cat)} <small>(${arr.length})</small></span><span>${closed?'＋':'－'}</span></button>${closed?'':arr.map(renderItem).join('')}</section>`}return out||'<div class="empty">登録がありません</div>'}
function renderItem(i){let qty=total(i),diff=shortage(i),batches=[...i.batches].sort((a,b)=>(a.expiry||'9999').localeCompare(b.expiry||'9999'));return `<div class="row"><div class="rowhead"><div class="rowname">${esc(i.name)} <div class="counts">${qty}${esc(i.unit)} ／ 目標${i.target?esc(i.target)+esc(i.unit):'未設定'}</div></div>${diff?`<div class="short">あと${diff}${esc(i.unit)}</div>`:i.target?'<span class="pill">✓ 達成</span>':''}</div>${i.note?`<div class="tip">${esc(i.note)}</div>`:''}<div class="detail">${batches.length?batches.map(b=>`<div class="batch"><span class="batchmeta">${fmtDate(b.expiry)}${b.place?' · '+esc(b.place):''}</span><div class="stepper"><button aria-label="減らす" onclick="adjust('${i.id}','${b.id}',-1)">－</button><input type="number" min="0" aria-label="数量" value="${b.qty}" onchange="setQty('${i.id}','${b.id}',this.value)"><button aria-label="増やす" onclick="adjust('${i.id}','${b.id}',1)">＋</button></div><button aria-label="編集" onclick="openBatch('${i.id}','${b.id}')">✎</button></div>`).join(''):'<div class="muted" style="font-size:12px">在庫なし</div>'}</div><div class="actions"><button onclick="openBatch('${i.id}')">＋ 補充・期限を追加</button><button onclick="openItem('${i.id}')">⚙️ 商品設定</button></div></div>`}
function toggleCat(k){state.closed[k]=!state.closed[k];save();render()}function adjust(id,bid,n){let b=get(id)?.batches.find(x=>x.id===bid);if(!b)return;b.qty=Math.max(0,b.qty+n);save();render()}function setQty(id,bid,n){let b=get(id)?.batches.find(x=>x.id===bid);if(!b)return;b.qty=Math.max(0,Math.floor(Number(n)||0));save();render()}
function renderTotal(){let all={};for(let i of state.items){let k=i.cat+'|'+i.name+'|'+i.unit;if(!all[k])all[k]={cat:i.cat,name:i.name,unit:i.unit,qty:0,entries:[]};all[k].qty+=total(i);for(let b of i.batches)if(b.qty>0)all[k].entries.push({page:i.page,...b})}let grouped=group(Object.values(all));return `<div class="summary">📋 備蓄・ローリングストック・あると便利の在庫を合算。タップすると内訳が見られます。</div>`+Object.entries(grouped).map(([cat,arr])=>`<section class="group"><div class="grouphead">${esc(cat)}</div>${arr.map(x=>{let k=x.cat+'|'+x.name+'|'+x.unit,open=state.totalOpen[k];return `<div class="row"><div class="rowhead" onclick="toggleTotal('${encodeURIComponent(k)}')" style="cursor:pointer"><span class="rowname">${esc(x.name)}</span><b>${x.qty}${esc(x.unit)} ${open?'⌃':'⌄'}</b></div>${open?`<div class="detail">${x.entries.length?x.entries.sort((a,b)=>(a.expiry||'9999').localeCompare(b.expiry||'9999')).map(b=>`<div class="totalbatch">${b.page==='stock'?'備蓄':b.page==='rolling'?'ローリング':'あると便利'} · ${b.qty}${esc(x.unit)} · ${fmtDate(b.expiry)}${b.place?' · '+esc(b.place):''}</div>`).join(''):'<div class="muted">在庫なし</div>'}</div>`:''}</div>`}).join('')}</section>`).join('')}
function toggleTotal(k){k=decodeURIComponent(k);state.totalOpen[k]=!state.totalOpen[k];save();render()}
function renderBuy(){let items=state.items.filter(i=>shortage(i)>0),out=`<div class="summary">不足数を赤字で表示。買いたいものだけ選んで「買いもの日和」へコピーできます。コピーしても在庫は変わりません。</div><div class="toolbar"><button onclick="selectAll(true)">☑ 全部選択</button><button onclick="selectAll(false)">選択解除</button></div>`;for(let [page,_,label] of TABS.filter(x=>['stock','rolling','useful'].includes(x[0]))){let arr=items.filter(i=>i.page===page);out+=`<section class="group"><div class="grouphead">${label} <small>${arr.length}件</small></div>${arr.length?arr.map(i=>{let diff=shortage(i),num=state.buyQty[i.id]??diff;return `<div class="row buyrow"><input class="check" type="checkbox" ${state.selected[i.id]?'checked':''} onchange="selectOne('${i.id}',this.checked)"><div class="rowname">${esc(i.name)}<div class="counts">在庫 ${total(i)} ／ 目標 ${i.target}${esc(i.unit)}</div></div><b class="short">あと${diff}${esc(i.unit)}</b><label class="buyqty">購入予定 <input type="number" min="1" value="${num}" onchange="setBuyQty('${i.id}',this.value)">${esc(i.unit)}</label></div>`}).join(''):'<div class="row muted">不足品なし ✓</div>'}</section>`}let count=items.filter(i=>state.selected[i.id]).length;return out+`<button class="primary" style="width:100%;padding:15px" onclick="copyBuy()">選択した商品をコピー（${count}件）</button><p class="tip">コピー後、「買いもの日和」のまとめ入力欄に貼り付けてね。</p>`}
function selectAll(yes){for(let i of state.items)state.selected[i.id]=yes&&shortage(i)>0;save();render()}function selectOne(id,yes){state.selected[id]=yes;save();render()}function setBuyQty(id,n){state.buyQty[id]=Math.max(1,Math.floor(Number(n)||1));save()}async function copyBuy(){let a=state.items.filter(i=>state.selected[i.id]&&shortage(i)>0).map(i=>`${i.name} ${state.buyQty[i.id]??shortage(i)}${i.unit}`);if(!a.length){alert('商品を選択してね');return}let s=a.join('。');try{await navigator.clipboard.writeText(s);alert(`${a.length}件をコピーしました！\n「買いもの日和」に貼り付けてね。`)}catch(e){showModal(`<h2>コピーする内容</h2><textarea id="copytext" style="width:100%;height:130px">${esc(s)}</textarea><div class="modalfoot"><button onclick="document.getElementById('copytext').select()">全選択</button><button onclick="closeModal()">閉じる</button></div>`)}}
function showModal(html){document.getElementById('overlay').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){document.getElementById('overlay').innerHTML=''}
function openItem(id,page){let i=id?get(id):{name:'',cat:'その他',page,target:0,unit:'個',note:''};showModal(`<h2>${id?'商品設定':'商品を追加'}</h2><form onsubmit="submitItem(event,'${id||''}')"><label class="field">商品名<input name="name" required value="${esc(i.name)}"></label><label class="field">ページ<select name="page">${[['stock','備蓄'],['rolling','ローリングストック'],['useful','あると便利']].map(([v,t])=>`<option value="${v}" ${i.page===v?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">カテゴリー<input name="cat" required value="${esc(i.cat)}" list="cats"></label><datalist id="cats">${[...new Set(state.items.map(x=>x.cat))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist><label class="field">目標数量（0なら未設定）<input name="target" type="number" min="0" value="${i.target}"></label><label class="field">単位<input name="unit" required value="${esc(i.unit)}"></label><label class="field">メモ（任意）<input name="note" value="${esc(i.note)}"></label><div class="modalfoot">${id?`<button type="button" class="danger" onclick="deleteItem('${id}')">削除</button>`:''}<button type="button" onclick="closeModal()">キャンセル</button><button class="primary">保存</button></div></form>`)}
function submitItem(e,id){e.preventDefault();let f=new FormData(e.target),v={name:String(f.get('name')).trim(),page:f.get('page'),cat:String(f.get('cat')).trim(),target:Math.max(0,Number(f.get('target'))||0),unit:String(f.get('unit')).trim(),note:String(f.get('note')).trim()};if(id)Object.assign(get(id),v);else state.items.push({id:uid(),...v,batches:[]});save();closeModal();render()}function deleteItem(id){if(!confirm('この商品と在庫情報を削除しますか？'))return;state.items=state.items.filter(i=>i.id!==id);save();closeModal();render()}
function openBatch(id,bid){let i=get(id),b=bid?i.batches.find(x=>x.id===bid):{qty:1,expiry:'',place:''};showModal(`<h2>${esc(i.name)}｜${bid?'内訳を編集':'補充する'}</h2><form onsubmit="submitBatch(event,'${id}','${bid||''}')"><label class="field">数量（${esc(i.unit)}）<input type="number" name="qty" min="0" required value="${b.qty}"></label><label class="field">賞味・使用期限（ない場合は空欄）<input type="date" name="expiry" value="${esc(b.expiry)}"></label><label class="field">保管場所（任意）<input name="place" list="places" value="${esc(b.place)}" placeholder="例：玄関収納"></label><datalist id="places">${[...new Set(state.items.flatMap(x=>x.batches.map(b=>b.place)).filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join('')}</datalist><div class="modalfoot">${bid?`<button type="button" class="danger" onclick="deleteBatch('${id}','${bid}')">内訳を削除</button>`:''}<button type="button" onclick="closeModal()">キャンセル</button><button class="primary">保存</button></div></form>`)}function submitBatch(e,id,bid){e.preventDefault();let i=get(id),f=new FormData(e.target),v={qty:Math.max(0,Math.floor(Number(f.get('qty'))||0)),expiry:String(f.get('expiry')),place:String(f.get('place')).trim()};if(bid)Object.assign(i.batches.find(x=>x.id===bid),v);else{let same=i.batches.find(b=>b.expiry===v.expiry&&b.place===v.place);if(same)same.qty+=v.qty;else i.batches.push({id:uid(),...v})}save();closeModal();render()}function deleteBatch(id,bid){if(!confirm('この内訳を削除しますか？'))return;let i=get(id);i.batches=i.batches.filter(x=>x.id!==bid);save();closeModal();render()}
function openSettings(){showModal(`<h2>⚙️ 設定・初期商品</h2><p class="tip">初期目標は家族4人・7日間を想定した編集可能な目安です。必要量は体調、食事制限、地域、家庭の状況に応じて調整してね。</p><div class="summary">現在の商品：${state.items.length}件<br>初期登録の商品を削除しても、下のボタンで不足分だけ復元できます。今ある在庫は消えません。</div><button class="ghost" onclick="restoreDefaults()">↩ 削除した初期商品を復元</button><hr style="border:0;border-top:1px solid #e5e9e3;margin:20px 0"><p class="tip">データはこの端末のブラウザに保存されます。ブラウザデータの消去や端末変更で失われる場合があるため、バックアップをおすすめします。</p><div class="toolbar"><button onclick="exportData()">データをバックアップ</button><button onclick="document.getElementById('importfile').click()">バックアップを読み込む</button><input id="importfile" type="file" accept="application/json" style="display:none" onchange="importData(event)"></div><div class="modalfoot"><button class="primary" onclick="closeModal()">閉じる</button></div>`)}function restoreDefaults(){let existing=new Set(state.items.map(i=>i.defaultId).filter(Boolean));let add=seed().filter(i=>!existing.has(i.defaultId));state.items.push(...add);save();closeModal();render();alert(`${add.length}件の初期商品を復元しました。`)}function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='防災管理_バックアップ.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.items))throw Error();if(!confirm('現在のデータをバックアップの内容で置き換えますか？'))return;state=x;save();closeModal();render()}catch(e){alert('バックアップファイルを読み込めませんでした')}};r.readAsText(f)}render();
</script></body></html>
